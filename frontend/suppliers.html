<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تأمین‌کنندگان | RAYAD</title>
<style>
:root{
  --bg:#f3f5f8;--panel:#fff;--ink:#15202b;--muted:#6b7280;--line:#e5e7eb;
  --navy:#111827;--gold2:#e3c45e;--green:#15966f;--greenbg:#e8f7f1;
  --red:#d9343a;--redbg:#feecee;--orange:#d97706;--orangebg:#fff4e3;
  --shadow:0 8px 30px rgba(15,23,42,.06);--r:16px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,select,input{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex}
.sidebar{width:260px;position:fixed;right:0;top:0;bottom:0;background:linear-gradient(180deg,var(--navy),#0c1320);color:#fff;padding:20px 15px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:10px 12px 26px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{width:42px;height:42px;border:1px solid rgba(227,196,94,.55);border-radius:13px;display:grid;place-items:center;color:var(--gold2);font-weight:900}
.brand b{font-size:16px}.brand small{display:block;color:#aeb8c6;margin-top:3px;font-size:10px}
.nav{padding-top:15px}
.nav a{display:flex;align-items:center;gap:10px;width:100%;color:#cbd5e1;padding:12px;border-radius:11px;margin:3px 0;text-decoration:none;font-size:13px}
.nav a:hover,.nav a.active{background:#263244;color:#fff}
.nav a.active{box-shadow:inset -3px 0 0 var(--gold2)}
.main{margin-right:260px;width:calc(100% - 260px)}
.topbar{height:70px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:10}
.titleRow h1{margin:0;font-size:20px}
.titleRow p{margin:4px 0 0;color:var(--muted);font-size:12px}
.content{padding:24px 30px 40px}
.upload-panel,.table-container{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.upload-panel{padding:20px;margin-bottom:20px}
.upload-head h3{margin:0 0 8px}
.upload-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:12px}
.upload-row .field{display:flex;flex-direction:column;gap:6px;flex:1}
.upload-row label{font-size:12px;font-weight:700;color:var(--muted)}
.upload-row input[type="file"]{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.upload-result{margin-top:12px;font-size:13px;font-weight:bold;min-height:20px}
.btn{border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{color:#7a8491;text-align:right;font-weight:700;padding:14px 16px;border-bottom:1px solid var(--line);background:#f9fafb}
.data-table td{padding:14px 16px;border-bottom:1px solid #eef0f3}
.data-table tr:hover td{background:#fafbfd}
.msg{font-size:13px;color:var(--muted);margin:0 0 12px}
@media(max-width:900px){
  .sidebar{width:70px}
  .brand b,.brand small,.nav a span:not(.ico){display:none}
  .main{margin-right:70px;width:calc(100% - 70px)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">R</div>
      <div><b>RAYAD</b><small>BUSINESS CONTROL</small></div>
    </div>
    <nav class="nav">
      <a href="dashboard.html"><span class="ico">⌂</span><span>داشبورد</span></a>
      <a href="finance.html"><span class="ico">₿</span><span>کنترل مالی</span></a>
      <a href="transactions.html"><span class="ico">◈</span><span>تراکنش‌ها</span></a>
      <a href="sales.html"><span class="ico">▣</span><span>فروش</span></a>
      <a href="suppliers.html" class="active"><span class="ico">◌</span><span>تأمین‌کنندگان</span></a>
      <a href="inventory.html"><span class="ico">▤</span><span>انبار</span></a>
      <a href="upload.html"><span class="ico">↑</span><span>آپلود</span></a>
      <a href="#" id="logoutBtn"><span class="ico">⏻</span><span>خروج</span></a>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="titleRow">
        <h1>تأمین‌کنندگان</h1>
        <p>آپلود و مشاهده مانده تأمین‌کنندگان</p>
      </div>
    </header>

    <div class="content">
      <section class="upload-panel">
        <div class="upload-head">
          <h3>آپلود مرور تأمین‌کنندگان</h3>
          <small style="color:var(--muted)">فایل «مرور تامین کنندگان» سپیدار را انتخاب کنید</small>
        </div>
        <div class="upload-row">
          <div class="field">
            <label for="supplierFile">فایل اکسل</label>
            <input type="file" id="supplierFile" accept=".xlsx,.xls,.csv">
          </div>
          <button type="button" id="supplierUploadBtn" class="btn primary">آپلود تأمین‌کنندگان</button>
        </div>
        <p id="supplierUploadMsg" class="upload-result"></p>
      </section>

      <p id="message" class="msg">در حال دریافت...</p>

      <section class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>کد</th>
              <th>عنوان</th>
              <th>گردش بدهکار</th>
              <th>مانده بدهکار</th>
              <th>مانده بستانکار</th>
            </tr>
          </thead>
          <tbody id="supplierBody"></tbody>
        </table>
      </section>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/suppliers.js"></script>
</body>
</html>
