<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امور مالی</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2>سامانه مدیریتی</h2>
        <ul>
            <li><a href="dashboard.html">داشبورد</a></li>
            <li><a href="sales.html">فروش</a></li>
            <li><a href="finance.html" class="active">مالی</a></li>
            <li><a href="banks.html">بانک</a></li>
            <li><a href="inventory.html">انبار</a></li>
            <li><a href="#" id="logoutBtn">خروج</a></li>
        </ul>
    </aside>

    <main class="content">
        <header>
            <h1>تراکنش‌های مالی</h1>
            <p id="message">در حال دریافت تراکنش‌ها...</p>
        </header>

        <!-- آپلود و به‌روزرسانی: نوع فایل را انتخاب کنید -->
        <section class="card upload-panel" id="uploadPanel">
            <div class="upload-head">
                <h3>آپلود و به‌روزرسانی داده‌های مالی</h3>
                <small>هر نوع فایل را جداگانه آپلود کنید؛ فقط داده‌ی همان نوع به‌روز می‌شود.</small>
            </div>
            <div class="upload-row">
                <label for="uploadType">نوع فایل</label>
                <select id="uploadType">
                    <option value="receivable">مطالبات (دریافتنی)</option>
                    <option value="payable">بدهی‌ها (بستانکاری)</option>
                    <option value="expense">گزارش هزینه</option>
                </select>
                <input type="file" id="uploadFile" accept=".xlsx,.xls,.csv">
                <button type="button" id="uploadBtn">آپلود فایل</button>
            </div>
            <p id="uploadResult" class="upload-result" role="status"></p>
        </section>

        <!-- تب‌ها: همه / مطالبات / بدهی‌ها / هزینه‌ها (توسط finance.js ساخته می‌شود) -->
        <nav id="financeTabs" class="tabs" aria-label="نوع تراکنش"></nav>
        <p id="financeSummary" class="table-summary"></p>

        <section class="table-container">
            <table id="financeTable" class="data-table">
                <thead>
                    <tr>
                        <th>نوع</th>
                        <th>طرف حساب</th>
                        <th>مبلغ (ریال)</th>
                        <th>توضیحات</th>
                    </tr>
                </thead>
                <tbody id="financeBody">
                    <!-- داده‌ها توسط JavaScript قرار می‌گیرند -->
                </tbody>
            </table>
        </section>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/uploader.js"></script>
<script src="js/finance.js"></script>
</body>
</html>
