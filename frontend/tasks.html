<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کنترل عملکرد | RAYAD</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#15202b;--muted:#6b7280;--line:#e5e7eb;--navy:#111827;--gold:#c9a227;--gold2:#e3c45e;--green:#15966f;--greenbg:#e8f7f1;--red:#d9343a;--redbg:#feecee;--orange:#d97706;--orangebg:#fff4e3;--blue:#2563eb;--bluebg:#eaf1ff;--shadow:0 8px 30px rgba(15,23,42,.06);--r:16px;}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.app{min-height:100vh;display:flex}.sidebar{width:260px;position:fixed;right:0;top:0;bottom:0;background:linear-gradient(180deg,var(--navy),#0c1320);color:#fff;padding:20px 15px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:10px 12px 26px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{width:42px;height:42px;border:1px solid rgba(227,196,94,.55);border-radius:13px;display:grid;place-items:center;color:var(--gold2);font-weight:900}
.brand b{font-size:16px}.brand small{display:block;color:#aeb8c6;margin-top:3px;font-size:10px}
.nav{padding-top:15px}.nav a{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#cbd5e1;text-align:right;padding:12px;border-radius:11px;margin:3px 0;text-decoration:none;font-size:13px}
.nav a:hover,.nav a.active{background:#263244;color:#fff}.nav a.active{box-shadow:inset -3px 0 0 var(--gold2)}
.main{margin-right:260px;width:calc(100% - 260px);min-width:0}
.topbar{height:70px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:10}
.titleRow h1{margin:0;font-size:20px}.titleRow p{margin:4px 0 0;color:var(--muted);font-size:12px}
.content{padding:24px 30px 40px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.data-table{width:100%;border-collapse:collapse;font-size:13px}.data-table th{color:#7a8491;text-align:right;font-weight:700;padding:14px 16px;border-bottom:1px solid var(--line);background:#f9fafb}
.data-table td{padding:14px 16px;border-bottom:1px solid #eef0f3}.data-table tr:hover td{background:#fafbfd}
.badge{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}
.bRed{background:var(--redbg);color:#b4232a}.bOrange{background:var(--orangebg);color:#a45100}.bGreen{background:var(--greenbg);color:#107a5a}.bBlue{background:var(--bluebg);color:#1d4ed8}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
@media(max-width:900px){.sidebar{width:70px}.brand b,.brand small,.nav a span:not(.ico){display:none}.main{margin-right:70px;width:calc(100% - 70px)}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">R</div><div><b>RAYAD</b><small>BUSINESS CONTROL</small></div></div>
    <nav class="nav">
      <a href="dashboard.html"><span class="ico">⌂</span><span>داشبورد مدیرعامل</span></a>
      <a href="finance.html"><span class="ico">₿</span><span>کنترل مالی</span></a>
      <a href="transactions.html"><span class="ico">◈</span><span>مرکز تراکنش‌ها</span></a>
      <a href="sales.html"><span class="ico">▣</span><span>کنترل فاکتورها</span></a>
      <a href="suppliers.html"><span class="ico"></span><span>تأمین‌کنندگان</span></a>
      <a href="inventory.html"><span class="ico">▤</span><span>مدیریت انبار</span></a>
      <a href="banking.html"><span class="ico">🏦</span><span>عملیات بانکی</span></a>
      <a href="tasks.html" class="active"><span class="ico">✓</span><span>کنترل عملکرد</span></a>
      <a href="reports.html"><span class="ico">▥</span><span>گزارش‌ها</span></a>
      <a href="smart-upload.html"><span class="ico">✨</span><span>آپلود هوشمند</span></a>
      <a href="#" id="logoutBtn"><span class="ico">⏻</span><span>خروج</span></a>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="titleRow"><h1>کنترل عملکرد و وظایف</h1><p>هیچ کار مهمی نباید در ذهن یک نفر گم شود.</p></div>
      <div style="border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:12px;font-size:12px;display:flex;align-items:center;gap:8px;"><span style="width:32px;height:32px;background:var(--bluebg);color:var(--blue);border-radius:50%;display:grid;place-items:center;font-weight:700;">م</span><span id="welcomeText">مدیر سیستم</span></div>
    </header>
    <div class="content">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h3 style="margin:0;font-size:15px;">وظایف در جریان</h3>
          <button class="btn primary">＋ ایجاد وظیفه جدید</button>
        </div>
        <table class="data-table">
          <thead><tr><th>عنوان وظیفه</th><th>مسئول</th><th>اولویت</th><th>مهلت</th><th>وضعیت</th></tr></thead>
          <tbody id="taskBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script>
requireLogin();
document.getElementById("welcomeText").textContent = (getUser()?.full_name) || "مدیر سیستم";
document.getElementById("logoutBtn").onclick = (e) => { e.preventDefault(); logout(); };

async function loadTasks() {
    try {
        const data = await apiGet("/tasks/list");
        const tbody = document.getElementById("taskBody");
        tbody.innerHTML = data.map(t => {
            const prioBadge = t.priority === 'critical' ? '<span class="badge bRed">بحرانی</span>' : t.priority === 'high' ? '<span class="badge bOrange">بالا</span>' : t.priority === 'medium' ? '<span class="badge bBlue">متوسط</span>' : '<span class="badge bGreen">پایین</span>';
            const statusBadge = t.status === 'completed' ? '<span class="badge bGreen">تکمیل‌شده</span>' : t.status === 'overdue' ? '<span class="badge bRed">عقب‌افتاده</span>' : t.status === 'in_progress' ? '<span class="badge bBlue">در حال انجام</span>' : '<span class="badge bOrange">در انتظار</span>';
            return `<tr><td><strong>${t.title}</strong><br><small style="color:var(--muted)">${t.description || ''}</small></td><td>${t.assigned_to}</td><td>${prioBadge}</td><td>${t.due_date}</td><td>${statusBadge}</td></tr>`;
        }).join("");
    } catch(e) { console.error(e); }
}
document.addEventListener("DOMContentLoaded", loadTasks);
</script>
</body>
</html>
