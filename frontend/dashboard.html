<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد مدیریتی</title>
    <!-- استایل‌های پروژه -->
    <link rel="stylesheet" href="css/style.css">
    <!-- کتابخانه Chart.js برای رسم نمودارها -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- نمودارها کوتاه‌تر و پهن‌تر (عدد بزرگ‌تر = نمودار کوتاه‌تر) -->
    <script>Chart.defaults.aspectRatio = 2.4;</script>
</head>
<body>
<div class="layout">
    <!-- سایدبار و ناوبری اصلی -->
    <aside class="sidebar">
        <h2>سامانه مدیریتی</h2>
        <ul>
            <li><a href="dashboard.html" class="active">داشبورد</a></li>
            <li><a href="sales.html">فروش</a></li>
            <li><a href="finance.html">مالی</a></li>
            <li><a href="banks.html">بانک</a></li>
            <li><a href="inventory.html">انبار</a></li>
            <li><a href="#" id="logoutBtn">خروج</a></li>
        </ul>
    </aside>

    <!-- محتوای اصلی داشبورد -->
    <main class="content">
        <header>
            <h1>داشبورد</h1>
            <p id="welcomeText">خوش آمدید</p>
            <p id="errorText" class="error"></p>
        </header>

        <!-- کارت‌های KPI -->
        <section class="cards">
            <div class="card">
                <h3>مجموع فروش</h3>
                <p id="kpiSales">—</p>
            </div>
            <div class="card">
                <h3>مطالبات</h3>
                <p id="kpiReceivables">—</p>
            </div>
            <div class="card">
                <h3>سفارش معوق</h3>
                <p id="kpiPendingOrders">—</p>
            </div>
            <div class="card">
                <h3>هشدارها</h3>
                <p id="kpiAlerts">—</p>
            </div>
        </section>

        <!-- نمودار روند فروش -->
        <section class="chart-box">
            <h3>روند فروش</h3>
            <canvas id="salesTrendChart"></canvas>
        </section>

        <!-- نمودار روند هزینه -->
        <section class="chart-box">
            <h3>روند هزینه</h3>
            <canvas id="expenseTrendChart"></canvas>
        </section>

        <!-- نمودار بیشترین مطالبات -->
        <section class="chart-box">
            <h3>بیشترین مطالبات (۱۰ مورد)</h3>
            <canvas id="receivablesTrendChart"></canvas>
        </section>

        <!-- هشدارها -->
        <section class="alerts">
            <h2>هشدارها</h2>
            <p id="alertsEmpty">هشدار مهمی وجود ندارد.</p>
            <ul id="alertsList" class="alert-list"></ul>
        </section>

        <!-- گزارش مدیریتی -->
        <section class="report">
            <h2>گزارش مدیریتی</h2>
            <div class="report-actions">
                <button type="button" id="copyReportBtn">کپی متن گزارش</button>
                <button type="button" id="printReportBtn">چاپ</button>
            </div>
            <div id="reportBody" class="report-card">
                در حال آماده‌سازی گزارش...
            </div>
        </section>
    </main>
</div>

<!-- اسکریپت‌های پروژه -->
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
