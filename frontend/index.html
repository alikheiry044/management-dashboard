<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | سامانه کنترل کسب‌وکار</title>

    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <!-- کارت لاگین -->
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md border-t-4 border-yellow-500">

        <!-- لوگو و عنوان -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-slate-900 rounded-xl flex items-center justify-center text-yellow-500 text-3xl font-bold mx-auto mb-4 border border-yellow-500/30 shadow-lg">
                R
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">RAYAD BUSINESS CONTROL</h1>
            <p class="text-slate-500 mt-2 text-sm">سامانه هوشمند کنترل و نظارت کسب‌وکار</p>
        </div>

        <!-- فرم ورود -->
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">ایمیل سازمانی</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 outline-none transition bg-slate-50"
                    placeholder="admin@test.com" value="admin@test.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">رمز عبور</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 outline-none transition bg-slate-50"
                    placeholder="••••••" value="123456">
            </div>

            <!-- باکس نمایش خطا -->
            <div id="errorMessage" class="hidden bg-red-50 text-red-700 p-3 rounded-lg text-sm border border-red-200 flex items-center gap-2" role="alert">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span></span>
            </div>

            <button type="submit"
                class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-lg transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-2 active:scale-[0.98]">
                <span>ورود به سامانه</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400 border-t border-slate-100 pt-4">
            نسخه نمایشی Enterprise Demo • داده‌ها نمونه هستند
        </div>
    </div>

    <!-- اتصال به فایل‌های جاوااسکریپتی که قبلاً ساختیم -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
